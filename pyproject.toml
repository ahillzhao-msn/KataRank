[project]
name = "katarank"
version = "0.1.0"
description = "Go player rank assessment via KataGo neural analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api  = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
katarank-train  = "katarank.train.train_kata_native:main"
katarank-server = "katarank.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katarank"]
# Include bin/ so katago.exe bundled alongside the wheel is preserved on install.
# The actual binary is gitignored; only .gitkeep ships in source control.
artifacts = ["src/katarank/bin/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
