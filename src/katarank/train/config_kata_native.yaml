# KataRank — Training Configuration (v3 / KAB2 pipeline)

model:
  hidden_dim: 128
  num_heads: 4
  num_inducing: 16
  encoder_depth: 2
  cross_depth: 1
  dropout: 0.1
  num_rank_classes: 29     # 20k … 9d

training:
  data_dir: "data/kab2"
  meta_csv: ~              # null = auto-detect data_dir/_meta.csv
  train_split: "T"
  val_split: "V"

  batch_size: 16
  epochs: 100
  learning_rate: 0.001
  lr_min: 0.00001
  weight_decay: 0.00001
  patience: 20
  gradient_clip: 1.0
  num_workers: 0

  max_moves: 400           # truncate long sequences (keep last N)
  min_moves: 5             # skip players with fewer moves

  loss_weights:
    rating_mse: 1.0
    bradley_terry: 0.5
    rank_anchor: 0.3       # confidence-weighted; auto-zero when rank=-1

  device: "auto"           # "auto" | "cpu" | "cuda" | "cuda:0"

output:
  checkpoint_dir: "nets/katarank"
